<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="4000" viewBox="0 0 1200 4000">
  <defs>
    <linearGradient id="page-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8fc"/>
      <stop offset="1" stop-color="#dce7f1"/>
    </linearGradient>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20252b"/>
      <stop offset="1" stop-color="#12161b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#52697c" flood-opacity="0.32"/>
    </filter>
    <clipPath id="screen-clip">
      <rect x="0" y="0" width="480" height="320" rx="2"/>
    </clipPath>
    <style>
      .ui { font-family: "DejaVu Sans", Arial, sans-serif; }
      .white { fill: #ffffff; }
      .cyan { fill: #00ffff; }
      .green { fill: #44ff66; }
      .blue { fill: #0078d4; }
      .dark { fill: #003b73; }
      .center { text-anchor: middle; }
      .right { text-anchor: end; }
    </style>

    <g id="device">
      <rect width="1200" height="800" fill="url(#page-bg)"/>
      <rect x="50" y="40" width="1100" height="720" rx="48" fill="url(#bezel)" filter="url(#shadow)"/>
      <rect x="108" y="68" width="984" height="664" rx="11" fill="#090c10" stroke="#434b54" stroke-width="4"/>
      <circle cx="600" cy="744" r="4.5" fill="#5b6169"/>
    </g>

    <g id="header" class="ui">
      <rect width="480" height="320" class="blue"/>
      <rect x="10" y="58" width="460" height="2" class="cyan"/>

      <rect x="12" y="35" width="7" height="8" rx="2" fill="#32e875"/>
      <rect x="23" y="28" width="7" height="15" rx="2" fill="#32e875"/>
      <rect x="34" y="21" width="7" height="22" rx="2" fill="#32e875"/>
      <rect x="45" y="14" width="7" height="29" rx="2" fill="#32e875"/>
      <text x="60" y="34" font-size="14" class="white">-61 dBm</text>

      <text x="240" y="29" font-size="28" font-weight="700" class="white center">15:05</text>
      <text x="240" y="51" font-size="14" class="white center">21 Jul 2026</text>

      <text x="462" y="39" font-size="36" font-weight="700" class="white right">26</text>
      <circle cx="470" cy="14" r="4" fill="none" stroke="#ffffff" stroke-width="2"/>
      <text x="12" y="80" font-size="14" class="green">AAC</text>
      <text x="468" y="80" font-size="14" class="green right">48 kbps</text>
    </g>

    <g id="footer" class="ui" fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
      <!-- Lista -->
      <circle cx="53" cy="291" r="1.5" fill="#ffffff" stroke="none"/>
      <circle cx="53" cy="297" r="1.5" fill="#ffffff" stroke="none"/>
      <circle cx="53" cy="303" r="1.5" fill="#ffffff" stroke="none"/>
      <path d="M58 291h14M58 297h14M58 303h14" stroke-width="2"/>

      <!-- Stop enquanto a rádio está tocando -->
      <rect x="173" y="290" width="14" height="14" rx="1" fill="#ffffff" stroke="none"/>

      <!-- Volume -->
      <path d="M289 294h6l7-6v18l-7-6h-6z" fill="#ffffff" stroke="none"/>
      <path d="M306 292c3 3 3 7 0 10M310 288c6 5 6 13 0 18" stroke-width="2"/>

      <!-- Configurações -->
      <text x="420" y="306" font-size="28" class="white center" fill="#ffffff" stroke="none">⚙</text>
    </g>
  </defs>

  <!-- TELA PRINCIPAL -->
  <g transform="translate(0 0)">
    <use xlink:href="#device"/>
    <g transform="translate(120 80) scale(2)" clip-path="url(#screen-clip)">
      <use xlink:href="#header"/>
      <g class="ui">
        <text x="240" y="112" font-size="18" class="cyan center">ANTENA 1</text>
        <text x="240" y="155" font-size="24" class="white center">STEVE MILLER BAND</text>
        <rect x="90" y="174" width="300" height="2" class="cyan"/>
        <text x="240" y="216" font-size="20" class="cyan center">JET AIRLINER</text>
        <g class="white">
          <rect x="72"  y="258" width="4" height="12" rx="2"/>
          <rect x="82"  y="245" width="4" height="25" rx="2"/>
          <rect x="92"  y="228" width="4" height="42" rx="2"/>
          <rect x="102" y="252" width="4" height="18" rx="2"/>
          <rect x="112" y="235" width="4" height="35" rx="2"/>
          <rect x="122" y="220" width="4" height="50" rx="2"/>
          <rect x="132" y="242" width="4" height="28" rx="2"/>
          <rect x="142" y="226" width="4" height="44" rx="2"/>
          <rect x="152" y="255" width="4" height="15" rx="2"/>
          <rect x="162" y="238" width="4" height="32" rx="2"/>
          <rect x="172" y="215" width="4" height="55" rx="2"/>
          <rect x="182" y="248" width="4" height="22" rx="2"/>
          <rect x="192" y="231" width="4" height="39" rx="2"/>
          <rect x="202" y="256" width="4" height="14" rx="2"/>
          <rect x="212" y="240" width="4" height="30" rx="2"/>
          <rect x="222" y="223" width="4" height="47" rx="2"/>
          <rect x="232" y="250" width="4" height="20" rx="2"/>
          <rect x="242" y="234" width="4" height="36" rx="2"/>
          <rect x="252" y="212" width="4" height="58" rx="2"/>
          <rect x="262" y="244" width="4" height="26" rx="2"/>
          <rect x="272" y="227" width="4" height="43" rx="2"/>
          <rect x="282" y="254" width="4" height="16" rx="2"/>
          <rect x="292" y="237" width="4" height="33" rx="2"/>
          <rect x="302" y="218" width="4" height="52" rx="2"/>
          <rect x="312" y="246" width="4" height="24" rx="2"/>
          <rect x="322" y="230" width="4" height="40" rx="2"/>
          <rect x="332" y="257" width="4" height="13" rx="2"/>
          <rect x="342" y="241" width="4" height="29" rx="2"/>
          <rect x="352" y="224" width="4" height="46" rx="2"/>
          <rect x="362" y="251" width="4" height="19" rx="2"/>
          <rect x="372" y="233" width="4" height="37" rx="2"/>
          <rect x="382" y="216" width="4" height="54" rx="2"/>
          <rect x="392" y="243" width="4" height="27" rx="2"/>
          <rect x="402" y="229" width="4" height="41" rx="2"/>
        </g>
      </g>
      <use xlink:href="#footer"/>
    </g>
  </g>

  <!-- LISTA DE ESTAÇÕES -->
  <g transform="translate(0 800)">
    <use xlink:href="#device"/>
    <g transform="translate(120 80) scale(2)" clip-path="url(#screen-clip)" class="ui">
      <use xlink:href="#header"/>
      <rect y="60" width="480" height="260" class="blue"/>
      <text x="240" y="91" font-size="20" class="white center">ESTACOES</text>
      <text x="445" y="95" font-size="25" class="white center">×</text>

      <rect x="10" y="105" width="460" height="44" class="blue"/>
      <text x="28" y="134" font-size="18" class="white">1 - RADIO CIDADE</text>

      <rect x="10" y="153" width="460" height="44" class="dark"/>
      <text x="28" y="182" font-size="18" class="cyan">2 - ANTENA 1</text>

      <rect x="10" y="201" width="460" height="44" class="blue"/>
      <text x="28" y="230" font-size="18" class="white">3 - CBN</text>

      <rect x="10" y="249" width="460" height="44" class="blue"/>
      <text x="28" y="278" font-size="18" class="white">4 - BAND NEWS FM</text>

      <rect x="10" y="297" width="460" height="44" class="blue"/>
      <text x="28" y="326" font-size="18" class="white">5 - RÁDIO NACIONAL</text>
    </g>
  </g>

  <!-- PAINEL DE VOLUME -->
  <g transform="translate(0 1600)">
    <use xlink:href="#device"/>
    <g transform="translate(120 80) scale(2)" clip-path="url(#screen-clip)" class="ui">
      <use xlink:href="#header"/>
      <rect y="60" width="480" height="260" class="blue"/>
      <text x="240" y="104" font-size="20" class="white center">VOLUME</text>
      <text x="240" y="181" font-size="28" font-weight="700" class="cyan center">57%</text>

      <text x="49" y="263" font-size="28" class="white center">−</text>
      <text x="428" y="263" font-size="28" class="white center">+</text>

      <rect x="70" y="243" width="340" height="18" rx="9" class="dark"/>
      <rect x="70" y="243" width="194" height="18" rx="9" class="cyan"/>
      <circle cx="264" cy="252" r="13" class="white"/>
    </g>
  </g>

  <!-- CONFIGURAÇÕES -->
  <g transform="translate(0 2400)">
    <use xlink:href="#device"/>
    <g transform="translate(120 80) scale(2)" clip-path="url(#screen-clip)" class="ui">
      <use xlink:href="#header"/>
      <rect y="82" width="480" height="238" class="blue"/>
      <text x="240" y="113" font-size="20" class="white center">CONFIGURACOES</text>
      <text x="445" y="117" font-size="25" class="white center">×</text>
      <rect x="90" y="130" width="300" height="2" class="cyan"/>

      <text x="25" y="179" font-size="18" class="white">BRILHO</text>
      <text x="270" y="179" font-size="24" class="white center">−</text>
      <text x="345" y="179" font-size="18" class="cyan center">70%</text>
      <text x="420" y="179" font-size="24" class="white center">+</text>

      <text x="25" y="245" font-size="18" class="white">FECHAR VOLUME</text>
      <text x="270" y="245" font-size="24" class="white center">−</text>
      <text x="345" y="245" font-size="18" class="cyan center">5s</text>
      <text x="420" y="245" font-size="24" class="white center">+</text>

      <text x="240" y="304" font-size="18" class="white center">SISTEMA  &gt;</text>
    </g>
  </g>

  <!-- INFORMAÇÕES DO SISTEMA -->
  <g transform="translate(0 3200)">
    <use xlink:href="#device"/>
    <g transform="translate(120 80) scale(2)" clip-path="url(#screen-clip)" class="ui">
      <use xlink:href="#header"/>
      <rect y="82" width="480" height="238" class="blue"/>
      <text x="35" y="117" font-size="24" class="white center">‹</text>
      <text x="240" y="113" font-size="20" class="white center">SISTEMA</text>
      <rect x="90" y="130" width="300" height="2" class="cyan"/>

      <text x="240" y="165" font-size="18" class="white center">Versao: 1.0.2</text>
      <text x="240" y="213" font-size="18" class="white center">Wi-Fi: MinhaRede</text>
      <text x="240" y="237" font-size="18" class="white center">IP: 192.168.1.45</text>
      <text x="240" y="261" font-size="18" class="white center">Memoria livre: 178 KB</text>
      <text x="240" y="285" font-size="18" class="white center">Ligado: 2h 14min</text>
    </g>
  </g>
</svg>
